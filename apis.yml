name: Patients Know Best
description: >-
  Patients Know Best (PKB) is a UK health-technology company operating what it
  describes as the world's largest personal health record, with more than seven
  million registered patients across the NHS and other health systems. The
  platform lets patients hold, view and share their medical records, messages,
  test results, care plans and questionnaires with clinicians and carers across
  web, mobile and the NHS App. For integrators, PKB publishes a HL7 FHIR STU3
  (3.0.2) API — the "Facade" FHIR server at my.patientsknowbest.com/fhir — that
  conforms to the NHS CareConnect profiles and exposes patient demographics,
  documents, observations, appointments, consent, questionnaires and read
  receipts, secured with OAuth 2.0 client-credentials. PKB was surfaced as a
  Seedcamp portfolio company and enriched into the API Evangelist network.
