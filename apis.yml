apis:
- name: PKB Facade FHIR API
  description: >-
    HL7 FHIR STU3 (3.0.2) "Facade" server exposing Patients Know Best personal
    health record data — Patient, Appointment, Communication, Consent,
    DiagnosticReport, DocumentReference, Encounter, Observation, Questionnaire
    and QuestionnaireResponse resources — conforming to NHS CareConnect
    profiles, plus custom operations for purview, read-receipt queries and
    invitation-token generation. Secured with OAuth 2.0 client credentials.
