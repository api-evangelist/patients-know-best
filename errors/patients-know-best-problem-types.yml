  title: Unauthorized
  detail: Missing or invalid OAuth 2.0 bearer access token.
- status: 403
  code: forbidden
  title: Forbidden
  detail: Authenticated client lacks permission for the requested patient record or operation.
- status: 404
  code: not-found
  title: Not Found
  detail: The requested FHIR resource or patient record does not exist or is not accessible.
- status: 422
  code: processing
  title: Unprocessable Entity
  detail: FHIR resource failed profile/business-rule validation (CareConnect profile constraint).
- status: 500
  code: exception
  title: Internal Server Error
  detail: Unexpected server error processing the FHIR request.
