notes: >-
  As a FHIR STU3 server, PKB returns an OperationOutcome resource (not an
  RFC 9457 problem+json body) on error. A documented conformance rule is
  that every identifier must carry both a system and a value; a resource
  missing either fails processing with an OperationOutcome exception.
